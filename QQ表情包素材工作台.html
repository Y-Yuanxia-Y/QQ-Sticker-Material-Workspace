<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>表情包素材工作台</title>
<style>
:root{
  --bg:#f7f7f8; --panel:#ffffff; --panel2:#fcfcfd; --panel3:#f4f4f5;
  --line:#e8e8ea; --line2:#f0f0f1; --line3:#dededf;
  --text:#101013; --sub:#66666e; --muted:#9b9ba3;
  --accent:#141418; --accent2:#000000; --accent-soft:#f4f4f5; --accent-line:#d6d6da;
  --ok:#141418; --ok-soft:#f4f4f5; --warn:#a05a12; --warn-soft:#fbf4ea; --err:#cf372b; --err-soft:#fceeed;
  --r:11px; --r-sm:8px;
  --shadow:none;
  --shadow-lg:0 16px 48px rgba(16,16,20,.16);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg); color:var(--text); font-size:13px; line-height:1.5;
  -webkit-font-smoothing:antialiased; overflow:auto;
}
body.resizing{cursor:col-resize;user-select:none}
body.resizing *{cursor:col-resize !important}
button{font-family:inherit;font-size:inherit;color:inherit;border:none;background:none;cursor:pointer;padding:0}
input{font-family:inherit;font-size:inherit;color:inherit}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#d8d8dc;border-radius:6px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:#b8b8bf;background-clip:content-box;border:3px solid transparent}
::-webkit-scrollbar-track{background:transparent}

/* ---------- shell ---------- */
.app{height:100%;display:flex;flex-direction:column;min-width:1180px}
.top{
  height:54px;flex:0 0 auto;display:flex;align-items:center;gap:14px;
  padding:0 18px;background:var(--panel);border-bottom:1px solid var(--line);z-index:5;
}
.brand{display:flex;align-items:baseline;gap:11px;min-width:0}
.brand h1{font-size:16.5px;font-weight:700;margin:0;letter-spacing:.4px;white-space:nowrap}
.brand .brand-sub{font-size:11.5px;color:var(--muted);letter-spacing:.3px;white-space:nowrap;position:relative;padding-left:12px}
.brand .brand-sub:before{content:"";position:absolute;left:0;top:50%;width:1px;height:10px;background:var(--line3);transform:translateY(-50%)}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:8px}
.stat{font-size:11.5px;color:var(--sub);padding:0 4px}
.stat b{color:var(--text);font-weight:650}

.btn{
  display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:8px;
  border:1px solid var(--line3);background:var(--panel);font-size:12.5px;font-weight:520;
  transition:.15s; white-space:nowrap;
}
.btn:hover{background:var(--panel3);border-color:#cfcfd4}
.btn:active{transform:translateY(.5px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#000;border-color:#000}
.btn.ghost{border-color:transparent;background:transparent;color:var(--sub)}
.btn.ghost:hover{background:var(--panel3);color:var(--text)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.sm{height:26px;padding:0 9px;font-size:11.5px;border-radius:7px}
.btn.block{width:100%;justify-content:center}

.main{flex:1;display:flex;gap:0;padding:9px;min-height:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;min-height:0;overflow:hidden}
.panel-assets{width:12.6%;flex:0 0 12.6%;min-width:168px}
.panel-stage{flex:1;flex-direction:row;min-width:460px}
.panel-export{width:21%;flex:0 0 21%;min-width:226px}
.panel-hd{
  height:40px;flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:0 12px;
  border-bottom:1px solid var(--line2);font-size:12.5px;font-weight:620;white-space:nowrap;
}
.panel-hd .sub{font-weight:400;font-size:11px;color:var(--muted);margin-left:auto}

/* 可拖拽分栏 */
.rs{flex:0 0 9px;position:relative;cursor:col-resize;z-index:3;touch-action:none}
.rs:before{content:"";position:absolute;left:50%;top:2px;bottom:2px;width:1px;background:transparent;transform:translateX(-50%);border-radius:2px;transition:background .14s,width .14s}
.rs:hover:before,.rs.on:before{width:2px;background:var(--text)}
.rs.rs-inner{flex:0 0 7px}
.rs.rs-inner:before{background:var(--line2)}
.rs-hint{position:fixed;z-index:80;background:var(--text);color:#fff;font-size:10.5px;padding:2px 7px;border-radius:5px;pointer-events:none;opacity:0;transition:opacity .12s;font-variant-numeric:tabular-nums}
.rs-hint.on{opacity:1}

/* ---------- assets ---------- */
.filters{display:flex;gap:3px;margin-left:auto;background:var(--panel3);padding:2px;border-radius:7px;flex:0 0 auto}
.filters button{height:20px;padding:0 6px;border-radius:5px;font-size:11px;color:var(--sub)}
.filters button.on{background:#fff;color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.08);font-weight:600}
.assets{flex:1;overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:5px;position:relative}
.asset{
  display:flex;gap:9px;padding:6px;border-radius:9px;border:1px solid transparent;cursor:grab;
  transition:.12s; position:relative; user-select:none;
}
.asset:hover{background:var(--panel3)}
.asset.sel{background:#f4f4f5;border-color:var(--text)}
.asset .thumb{
  width:46px;height:46px;flex:0 0 46px;border-radius:7px;overflow:hidden;
  display:grid;place-items:center;border:1px solid var(--line2);
}
.asset .thumb img{max-width:100%;max-height:100%;display:block}
.asset .info{min-width:0;flex:1;display:flex;flex-direction:column;justify-content:center;gap:2px}
.asset .nm{font-size:12px;font-weight:560;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.asset .meta{font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.badge{display:inline-block;padding:0 4px;height:14px;line-height:14px;border-radius:4px;font-size:9.5px;font-weight:700;letter-spacing:.3px;vertical-align:1px}
.badge.gif,.badge.png{background:#f0f0f1;color:#4a4a52}
.badge.gen{background:var(--text);color:#fff}
.asset .del{
  position:absolute;right:5px;top:5px;width:17px;height:17px;border-radius:5px;display:none;
  place-items:center;background:#fff;border:1px solid var(--line);color:var(--sub);font-size:11px;line-height:1;
}
.asset:hover .del{display:grid}
.asset .del:hover{color:var(--err);border-color:#f0c3bf}
.asset .quick{
  position:absolute;right:5px;bottom:5px;height:18px;padding:0 5px;border-radius:5px;display:none;
  align-items:center;background:#fff;border:1px solid var(--line);color:var(--sub);font-size:10.5px;
}
.asset:hover .quick{display:flex}
.asset .quick:hover{color:#fff;border-color:var(--text);background:var(--text)}
.empty-tip{padding:26px 14px;text-align:center;color:var(--muted);font-size:11.5px;line-height:1.7}
.empty-tip b{display:block;color:var(--sub);font-size:12px;margin-bottom:3px;font-weight:600}
.assets.dragover{background:#fafafa;outline:1px dashed var(--text);outline-offset:-6px;border-radius:9px}

/* ---------- stage ---------- */
.stage-left{width:28%;flex:0 0 28%;min-width:246px;display:flex;flex-direction:column;min-height:0;background:var(--panel)}
.preview-wrap{padding:11px;flex:0 0 auto;display:flex;justify-content:center}
.preview-card{width:min(100%,34vh);min-width:180px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.preview-hd{display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid var(--line2);font-size:11px;color:var(--sub)}
.preview-hd .name{font-weight:600;color:var(--text);font-size:11.5px;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.preview-hd .tag{margin-left:auto;font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}
.preview-body{
  width:100%;aspect-ratio:1/1;display:grid;place-items:center;position:relative;overflow:hidden;
  background-image:linear-gradient(45deg,#f1f1f2 25%,transparent 25%),linear-gradient(-45deg,#f1f1f2 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#f1f1f2 75%),linear-gradient(-45deg,transparent 75%,#f1f1f2 75%);
  background-size:18px 18px;background-position:0 0,0 9px,9px -9px,-9px 0;
}
.preview-body canvas{width:100%;height:100%;object-fit:contain;display:block;image-rendering:auto}
.preview-empty{color:var(--muted);font-size:11.5px;text-align:center;padding:20px;line-height:1.8}
.preview-ft{display:flex;align-items:center;gap:6px;padding:7px 10px;border-top:1px solid var(--line2);font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.preview-ft .dot{width:3px;height:3px;border-radius:50%;background:var(--line3)}
.preview-ft .sp{margin-left:auto}

/* ---------- ops ---------- */
.ops{flex:1;min-height:0;overflow-y:auto;background:var(--panel);border-top:1px solid var(--line2)}
.ops-foot{flex:0 0 auto;padding:10px 12px 12px;border-top:1px solid var(--line);background:var(--panel)}
.ops-block{background:transparent;border:0;border-radius:0;padding:11px 12px 12px;margin:0}
.ops-title{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:650;color:var(--text);margin:0 0 10px}
.ops-title .hint{font-weight:400;font-size:10px;color:var(--muted);margin-left:auto}
.row{display:flex;align-items:center;gap:7px;margin-bottom:7px}
.row:last-child{margin-bottom:0}
.row > label.lb{width:38px;flex:0 0 38px;font-size:11px;color:var(--sub)}
.row .val{font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:26px;text-align:right}
input[type=range]{
  -webkit-appearance:none;appearance:none;height:3px;border-radius:3px;background:var(--line3);
  flex:1;min-width:0;outline:none;cursor:pointer;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:#fff;
  border:2px solid var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.16);cursor:grab;
}
input[type=number],input[type=text]{
  height:25px;border:1px solid var(--line3);border-radius:6px;padding:0 6px;background:#fff;
  font-size:11.5px;width:52px;text-align:center;outline:none;font-variant-numeric:tabular-nums;
}
input[type=number]:focus,input[type=text]:focus{border-color:var(--text);box-shadow:0 0 0 3px rgba(16,16,20,.07)}
input[type=number]::-webkit-inner-spin-button{opacity:.35;height:18px}
.seg{display:flex;background:var(--panel3);border-radius:7px;padding:2px;gap:2px;flex:1}
.seg button{flex:1;height:22px;border-radius:5px;font-size:11px;color:var(--sub);white-space:nowrap;padding:0 4px}
.seg button.on{background:#fff;color:var(--text);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.1)}
.mini{height:22px;padding:0 7px;border-radius:6px;border:1px solid var(--line3);font-size:10.5px;color:var(--sub);background:#fff;white-space:nowrap}
.mini:hover{border-color:var(--text);color:var(--text)}
.mini.on{background:var(--text);border-color:var(--text);color:#fff}
.switch{position:relative;width:30px;height:17px;flex:0 0 30px;cursor:pointer}
.switch input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
.switch i{position:absolute;inset:0;background:var(--line3);border-radius:9px;transition:.18s}
.switch i:after{content:"";position:absolute;width:13px;height:13px;left:2px;top:2px;background:#fff;border-radius:50%;transition:.18s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch input:checked + i{background:var(--accent)}
.switch input:checked + i:after{transform:translateX(13px)}
.gen-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:2px}
.gen-row .btn{height:30px;padding:0 4px;justify-content:center;font-size:11.5px}
.gen-row .btn.wide{grid-column:span 3}
.ops-note{font-size:10.5px;color:var(--muted);line-height:1.65;margin:0;padding:2px 12px 14px}
.ops-note b{color:var(--warn);font-weight:600}

/* ---------- board ---------- */
.stage-right{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--panel);min-height:0;position:relative}
.board-fade{position:absolute;left:1px;right:1px;bottom:1px;height:46px;border-radius:0 0 10px 10px;background:linear-gradient(to top,#fff 14%,rgba(255,255,255,0));pointer-events:none;opacity:0;transition:opacity .18s}
.stage-right.more .board-fade{opacity:1}
.board-hd{height:40px;flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:0 12px;border-bottom:1px solid var(--line2);font-size:12.5px;font-weight:620}
.board-hd .sub{font-weight:400;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.board-hd .sp{margin-left:auto;display:flex;gap:6px;align-items:center}
.board{flex:1;overflow-y:auto;padding:12px 14px 18px}
.cover-row{display:flex;gap:12px;align-items:center;margin:0 auto 12px;max-width:1200px}
.cover-slot{
  width:64px;height:64px;flex:0 0 64px;border-radius:9px;border:1px dashed var(--line3);background:#fafafa;
  display:grid;place-items:center;cursor:pointer;position:relative;overflow:hidden;transition:.15s;
}
.cover-slot:hover{border-color:var(--text);background:#f4f4f5}
.cover-slot.drop{border-color:var(--text);background:#f4f4f5;box-shadow:0 0 0 3px rgba(16,16,20,.08)}
.cover-slot img{width:100%;height:100%;object-fit:contain;display:block}
.cover-slot .ph{text-align:center;color:var(--muted);font-size:10px;line-height:1.4}
.cover-slot .ph b{display:block;font-size:17px;font-weight:300;line-height:1;margin-bottom:2px}
.cover-slot .clr{position:absolute;right:2px;top:2px;width:16px;height:16px;border-radius:5px;background:rgba(255,255,255,.95);border:1px solid var(--line);display:none;place-items:center;font-size:10px;color:var(--sub);line-height:1}
.cover-slot:hover .clr{display:grid}
.cover-meta{flex:1;min-width:0}
.cover-meta .t{font-size:15px;font-weight:700;letter-spacing:.3px;margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cover-meta .d{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.cover-meta .d b{color:var(--sub);font-weight:600}

.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;max-width:1200px;margin:0 auto}
.card{
  position:relative;border:1px solid var(--line);border-radius:10px;background:var(--panel);
  padding:0 0 4px;transition:.15s;overflow:hidden;
}
.card:hover{border-color:var(--line3)}
.card.drop{border-color:var(--text);box-shadow:0 0 0 2px rgba(16,16,20,.1)}
.card.dragging{opacity:.35}
.card.filled{background:#fff}
.bar{
  height:18px;display:flex;align-items:center;gap:4px;padding:0 6px;cursor:grab;
  border-bottom:1px solid var(--line2);background:var(--panel3);font-size:10px;color:var(--muted);
  font-variant-numeric:tabular-nums;user-select:none;
}
.bar:active{cursor:grabbing}
.bar .no{font-weight:700;color:var(--sub);letter-spacing:.3px}
.bar .grip{width:9px;height:9px;opacity:.55;background-image:radial-gradient(circle,currentColor 1px,transparent 1.2px);background-size:3px 3px;margin-right:1px}
.bar .st{margin-left:auto;width:6px;height:6px;flex:0 0 6px;border-radius:50%;background:var(--line3)}
.bar .st.ok{background:var(--text)}
.bar .st.bad{background:var(--warn)}
.bar .st.none{background:var(--line3)}
.bar .x{width:14px;height:14px;border-radius:4px;display:none;place-items:center;font-size:11px;color:var(--muted);line-height:1}
.card:hover .bar .x{display:grid}
.bar .x:hover{background:#fdecee;color:var(--err)}
.flip{perspective:700px;margin:4px 5px 0}
.flip-in{position:relative;width:100%;height:var(--face-h,120px);transform-style:preserve-3d;transition:transform .42s cubic-bezier(.4,.2,.2,1)}
.flip.flipped .flip-in{transform:rotateY(180deg)}
.face{
  position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  border-radius:7px;overflow:hidden;display:grid;place-items:center;
  background-image:linear-gradient(45deg,#eef0f3 25%,transparent 25%),linear-gradient(-45deg,#eef0f3 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#eef0f3 75%),linear-gradient(-45deg,transparent 75%,#eef0f3 75%);
  background-size:12px 12px;background-position:0 0,0 6px,6px -6px,-6px 0;
  background-color:#fff;border:1px solid var(--line2);
}
.face.back{transform:rotateY(180deg)}
.face img{width:100%;height:100%;object-fit:contain;display:block}
.face .ph{display:flex;flex-direction:column;align-items:center;gap:1px;color:#c3c9d3;pointer-events:none}
.face .ph b{font-size:19px;font-weight:300;line-height:1}
.face .ph span{font-size:9.5px;letter-spacing:.4px}
.face.clickable{cursor:pointer}
.face.clickable:hover{background-color:#f7f7f8;border-color:var(--line3)}
.card .nm-row{padding:4px 5px 0;display:flex;align-items:center;gap:4px}
.card input.nm{
  flex:1;min-width:0;width:auto;height:20px;border:1px solid transparent;background:transparent;border-radius:6px;
  padding:0 4px;font-size:11.5px;text-align:center;outline:none;
}
.card input.nm:hover{background:var(--panel3)}
.card input.nm:focus{background:#fff;border-color:var(--text);box-shadow:0 0 0 2px rgba(16,16,20,.07)}
.card input.nm.err{color:var(--err);background:var(--err-soft)}
.tg{
  height:20px;flex:0 0 auto;padding:0 7px;border-radius:6px;font-size:9.5px;font-weight:700;letter-spacing:.3px;
  display:inline-flex;align-items:center;gap:2px;border:1px solid var(--line3);color:var(--sub);background:#fff;
}
.tg:hover{border-color:var(--text);color:var(--text)}
.tg .sw{font-size:9px;opacity:.7}
.tg.g{color:#4a4a52;border-color:var(--line3);background:#f6f6f7}
.tg.p{color:#fff;border-color:var(--text);background:var(--text)}
.tg.p:hover{background:#000;border-color:#000;color:#fff}
.board-empty{text-align:center;color:var(--muted);font-size:11.5px;padding:6px 0 10px}

/* ---------- export ---------- */
.exp{flex:1;overflow-y:auto;padding:10px}
.exp-block{margin-bottom:9px}
.exp-label{font-size:11px;color:var(--sub);margin-bottom:5px;display:flex;align-items:center;gap:5px}
.exp-label .sp{margin-left:auto;font-size:10px;color:var(--muted)}
.field{display:flex;gap:6px}
.field input[type=text]{flex:1;width:auto;text-align:left;height:28px;font-size:12px;padding:0 8px}
.path-box{
  display:flex;align-items:center;gap:7px;height:30px;padding:0 9px;border:1px solid var(--line3);
  border-radius:7px;background:#fafafa;font-size:11px;color:var(--sub);min-width:0;
}
.path-box .ic{color:var(--muted);font-size:11px}
.path-box .p{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:rtl;text-align:left;flex:1}
.path-box .p.default{color:var(--muted)}
.tree{background:#fafafa;border:1px solid var(--line2);border-radius:8px;padding:9px 10px;font-size:11px;color:var(--sub);line-height:1.8;font-variant-numeric:tabular-nums}
.tree .f{color:var(--text);font-weight:600}
.tree .b{color:var(--muted)}
.tree .t{color:var(--text);font-weight:560}
.chk{display:flex;flex-direction:column;gap:1px}
.chk-item{display:flex;align-items:center;gap:6px;padding:4px 0;font-size:11px;color:var(--sub)}
.chk-item .ic{width:14px;height:14px;border-radius:50%;flex:0 0 14px;display:grid;place-items:center;font-size:9px;font-weight:700;color:#fff}
.chk-item.ok .ic{background:var(--ok)}
.chk-item.warn .ic{background:var(--warn)}
.chk-item.err .ic{background:var(--err)}
.chk-item .sp{margin-left:auto;font-variant-numeric:tabular-nums;font-size:10px;color:var(--muted)}
.chk-item.err{color:var(--err)}
.chk-item.warn{color:var(--warn)}
.exp-foot{position:sticky;bottom:-10px;background:linear-gradient(to bottom,rgba(255,255,255,.4),#fff 22%);padding-top:8px;padding-bottom:10px;margin-top:2px}
.progress{height:3px;border-radius:3px;background:var(--line2);overflow:hidden;margin-bottom:7px;display:none}
.progress.on{display:block}
.progress i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s;border-radius:3px}
.export-btn{height:38px;width:100%;border-radius:9px;background:var(--text);color:#fff;font-size:13px;font-weight:620;letter-spacing:.3px;transition:.15s}
.export-btn:hover{background:#000}
.export-btn:disabled{opacity:.35;cursor:not-allowed}
.hint-line{font-size:10.5px;color:var(--muted);line-height:1.65;margin-top:7px}

/* ---------- modal ---------- */
.mask{position:fixed;inset:0;background:rgba(20,25,35,.38);backdrop-filter:blur(2px);z-index:50;display:none;align-items:center;justify-content:center;padding:24px}
.mask.on{display:flex}
.modal{background:#fff;border-radius:14px;box-shadow:var(--shadow-lg);width:600px;max-width:100%;max-height:100%;display:flex;flex-direction:column;overflow:hidden;animation:pop .18s ease}
@keyframes pop{from{transform:scale(.97) translateY(6px);opacity:0}to{transform:none;opacity:1}}
.modal-hd{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line2)}
.modal-hd h3{margin:0;font-size:13px;font-weight:650}
.modal-hd .x{margin-left:auto;width:24px;height:24px;border-radius:6px;display:grid;place-items:center;color:var(--sub);font-size:14px}
.modal-hd .x:hover{background:var(--panel3)}
.modal-bd{padding:14px 16px;overflow-y:auto;min-height:0}
.modal-ft{padding:10px 16px;border-top:1px solid var(--line2);display:flex;gap:8px;align-items:center}
.modal-ft .sp{margin-left:auto}
.pick-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.pick{
  border:1px solid var(--line);border-radius:9px;padding:5px;cursor:pointer;text-align:center;
  transition:.12s;background:#fff;
}
.pick:hover{border-color:var(--text);background:#fafafa;transform:translateY(-1px)}
.pick .im{height:62px;display:grid;place-items:center;margin-bottom:4px;border-radius:6px;overflow:hidden}
.pick .im img{max-width:100%;max-height:62px;display:block}
.pick .nm{font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--sub)}
.pick .dim{font-size:9px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:1px}
.spec-list{font-size:12px;line-height:1.9;color:var(--sub)}
.spec-list h4{margin:15px 0 4px;font-size:12px;color:var(--text);font-weight:680}
.spec-list h4:first-child{margin-top:0}
.spec-list code{background:#f4f4f5;padding:1px 5px;border-radius:4px;font-size:11px;color:var(--text);font-family:ui-monospace,Menlo,monospace}
.spec-list .k{color:var(--text);font-weight:600}
.warn-list{font-size:12px;line-height:1.8;color:var(--sub);max-height:280px;overflow:auto}
.warn-list .w{color:var(--warn)}
.warn-list .e{color:var(--err)}

/* toast */
.toasts{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:99;display:flex;flex-direction:column;gap:7px;align-items:center;pointer-events:none}
.toast{
  background:#141418;color:#fff;padding:8px 14px;border-radius:9px;font-size:12px;
  animation:tin .2s ease;max-width:560px;line-height:1.5;
}
.toast.ok{background:#141418}
.toast.err{background:#c0342a}
.toast.warn{background:#96601a}
@keyframes tin{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}

/* loader */
.spin{width:13px;height:13px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;display:inline-block}
.spin.dark{border-color:rgba(16,16,20,.15);border-top-color:var(--text)}
@keyframes sp{to{transform:rotate(360deg)}}
.busy-veil{position:absolute;inset:0;background:rgba(255,255,255,.75);display:grid;place-items:center;z-index:4;font-size:11.5px;color:var(--sub);gap:8px;border-radius:var(--r)}
.busy-veil .box{display:flex;align-items:center;gap:7px;background:#fff;padding:8px 12px;border-radius:9px;border:1px solid var(--line)}

<script>
/* ============================================================
   0. 基础工具
   ============================================================ */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const sleep = ms => new Promise(r => setTimeout(r, ms));
const fmtBytes = n => {
  if (!n && n !== 0) return '—';
  if (n < 1024) return n + ' B';
  if (n < 1024 * 1024) return (n / 1024).toFixed(n < 10240 ? 1 : 0) + ' KB';
  return (n / 1048576).toFixed(2) + ' MB';
};
const pad2 = n => String(n).padStart(2, '0');
let _uid = 0;
const uid = p => p + '_' + Date.now().toString(36) + '_' + (++_uid);
const isCJK = ch => /[\u3400-\u4dbf\u4e00-\u9fff\uf900-\ufaff\u3040-\u30ff]/.test(ch);

/* ---------- CRC32 ---------- */
const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[n] = c >>> 0;
  }
  return t;
})();
function crc32(u8, seed) {
  let c = (seed === undefined ? 0 : seed) ^ 0xFFFFFFFF;
  for (let i = 0; i < u8.length; i++) c = CRC_TABLE[(c ^ u8[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}

/* ---------- 可增长字节缓冲 ---------- */
class Buf {
  constructor(n = 4096) { this.a = new Uint8Array(n); this.n = 0; }
  need(k) {
    if (this.n + k <= this.a.length) return;
    let s = this.a.length * 2;
    while (s < this.n + k) s *= 2;
    const b = new Uint8Array(s); b.set(this.a.subarray(0, this.n)); this.a = b;
  }
  u8(v) { this.need(1); this.a[this.n++] = v & 255; }
  u16(v) { this.need(2); this.a[this.n++] = v & 255; this.a[this.n++] = (v >> 8) & 255; }
  u32(v) { this.need(4); this.a[this.n++] = v & 255; this.a[this.n++] = (v >>> 8) & 255; this.a[this.n++] = (v >>> 16) & 255; this.a[this.n++] = (v >>> 24) & 255; }
  u32be(v) { this.need(4); this.a[this.n++] = (v >>> 24) & 255; this.a[this.n++] = (v >>> 16) & 255; this.a[this.n++] = (v >>> 8) & 255; this.a[this.n++] = v & 255; }
  bytes(b) { this.need(b.length); this.a.set(b, this.n); this.n += b.length; }
  str(s) { for (let i = 0; i < s.length; i++) this.u8(s.charCodeAt(i)); }
  done() { return this.a.slice(0, this.n); }
}

/* ============================================================
   1. ZIP 读取 / 写入（无依赖，用浏览器原生 deflate）
   ============================================================ */
function decodeZipName(bytes, utf8Flag) {
  if (!utf8Flag) {
    try { return new TextDecoder('utf-8', { fatal: true }).decode(bytes); } catch (e) { }
    try { return new TextDecoder('gbk').decode(bytes); } catch (e) { }
  }
  return new TextDecoder('utf-8').decode(bytes);
}
async function inflateRaw(u8) {
  if (typeof DecompressionStream === 'undefined') throw new Error('当前浏览器不支持解压（请用 Chrome / Edge 打开）');
  const s = new Blob([u8]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  return new Uint8Array(await new Response(s).arrayBuffer());
}
async function unzip(buf) {
  const u8 = new Uint8Array(buf);
  const dv = new DataView(buf);
  let eocd = -1;
  const floor = Math.max(0, u8.length - 66000);
  for (let i = u8.length - 22; i >= floor; i--) {
    if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  }
  if (eocd < 0) throw new Error('不是有效的 ZIP 文件');
  let total = dv.getUint16(eocd + 10, true);
  let cdOff = dv.getUint32(eocd + 16, true);
  if (total === 0xFFFF || cdOff === 0xFFFFFFFF) throw new Error('暂不支持 ZIP64，请用普通方式重新压缩');
  const out = [];
  let p = cdOff;
  for (let i = 0; i < total; i++) {
    if (dv.getUint32(p, true) !== 0x02014b50) break;
    const flag = dv.getUint16(p + 8, true);
    const method = dv.getUint16(p + 10, true);
    const csize = dv.getUint32(p + 20, true);
    const usize = dv.getUint32(p + 24, true);
    const nlen = dv.getUint16(p + 28, true);
    const elen = dv.getUint16(p + 30, true);
    const clen = dv.getUint16(p + 32, true);
    const lho = dv.getUint32(p + 42, true);
    const nameBytes = u8.subarray(p + 46, p + 46 + nlen);
    const name = decodeZipName(nameBytes, !!(flag & 0x800));
    p += 46 + nlen + elen + clen;
    if (name.endsWith('/')) continue;
    const lnlen = dv.getUint16(lho + 26, true);
    const lelen = dv.getUint16(lho + 28, true);
    const start = lho + 30 + lnlen + lelen;
    const raw = u8.subarray(start, start + csize);
    let data;
    if (method === 0) data = raw.slice();
    else if (method === 8) data = await inflateRaw(raw);
    else { out.push({ name, error: '不支持的压缩方式(' + method + ')' }); continue; }
    out.push({ name, data, size: usize });
  }
  return out;
}
function dosTime(d) {
  const t = ((d.getHours() & 31) << 11) | ((d.getMinutes() & 63) << 5) | ((d.getSeconds() / 2) & 31);
  const dt = (((d.getFullYear() - 1980) & 127) << 9) | (((d.getMonth() + 1) & 15) << 5) | (d.getDate() & 31);
  return [t, dt];
}
function makeZip(files) {
  const now = new Date();
  const [tm, dt] = dosTime(now);
  const bw = new Buf(1024 * 256);
  const central = [];
  for (const f of files) {
    const nameB = new TextEncoder().encode(f.name);
    const data = f.data;
    const crc = crc32(data);
    const off = bw.n;
    bw.u32(0x04034b50); bw.u16(20); bw.u16(0x0800); bw.u16(0);
    bw.u16(tm); bw.u16(dt); bw.u32(crc); bw.u32(data.length); bw.u32(data.length);
    bw.u16(nameB.length); bw.u16(0); bw.bytes(nameB); bw.bytes(data);
    central.push({ nameB, crc, len: data.length, off });
  }
  const cdStart = bw.n;
  for (const c of central) {
    bw.u32(0x02014b50); bw.u16(20); bw.u16(20); bw.u16(0x0800); bw.u16(0);
    bw.u16(tm); bw.u16(dt); bw.u32(c.crc); bw.u32(c.len); bw.u32(c.len);
    bw.u16(c.nameB.length); bw.u16(0); bw.u16(0); bw.u16(0); bw.u16(0); bw.u32(0); bw.u32(c.off);
    bw.bytes(c.nameB);
  }
  const cdSize = bw.n - cdStart;
  bw.u32(0x06054b50); bw.u16(0); bw.u16(0); bw.u16(central.length); bw.u16(central.length);
  bw.u32(cdSize); bw.u32(cdStart); bw.u16(0);
  return new Blob([bw.done()], { type: 'application/zip' });
}

/* ============================================================
   2. GIF 解析 / 解码
   ============================================================ */
class Rd {
  constructor(b) { this.b = b; this.p = 0; }
  get eof() { return this.p >= this.b.length; }
  u8() { return this.b[this.p++]; }
  u16() { const v = this.b[this.p] | (this.b[this.p + 1] << 8); this.p += 2; return v; }
  bytes(n) { const r = this.b.subarray(this.p, this.p + n); this.p += n; return r; }
  str(n) { let s = ''; for (let i = 0; i < n; i++) s += String.fromCharCode(this.b[this.p++]); return s; }
  skip(n) { this.p += n; }
  subBlocks(collect) {
    if (!collect) { while (true) { const n = this.u8(); if (!n) break; this.p += n; } return null; }
    const parts = []; let total = 0;
    while (true) {
      const n = this.u8(); if (!n) break;
      parts.push(this.b.subarray(this.p, this.p + n)); this.p += n; total += n;
    }
    const out = new Uint8Array(total); let o = 0;
    for (const p of parts) { out.set(p, o); o += p.length; }
    return out;
  }
}
function parseGif(bytes, collect) {
  const rd = new Rd(bytes);
  const sig = rd.str(6);
  if (sig.slice(0, 3) !== 'GIF') throw new Error('不是 GIF 文件');
  const width = rd.u16(), height = rd.u16();
  const packed = rd.u8();
  rd.u8(); rd.u8();
  let gct = null;
  if (packed & 0x80) { const n = 1 << ((packed & 7) + 1); gct = rd.bytes(n * 3); }
  const frames = [];
  let gce = null, loop = 0;
  while (!rd.eof) {
    const t = rd.u8();
    if (t === 0x3B) break;
    if (t === 0x21) {
      const label = rd.u8();
      if (label === 0xF9) {
        const size = rd.u8();
        if (size >= 4) {
          const pk = rd.u8();
          const delay = rd.u16();
          const ti = rd.u8();
          gce = { disposal: (pk >> 2) & 7, transparent: !!(pk & 1), transIdx: ti, delay };
          if (size > 4) rd.skip(size - 4);
        } else if (size > 0) rd.skip(size);
        rd.u8();
      } else if (label === 0xFF) {
        const size = rd.u8();
        const app = size > 0 ? rd.str(size) : '';
        if (size > 0 && app.indexOf('NETSCAPE') === 0) {
          const sub = rd.u8();
          if (sub >= 3) { const a = rd.bytes(sub); loop = a[1] | (a[2] << 8); }
          else if (sub > 0) rd.skip(sub);
          rd.subBlocks(false);
        } else {
          if (size > 0) rd.subBlocks(false);
        }
      } else {
        rd.subBlocks(false);
      }
    } else if (t === 0x2C) {
      const left = rd.u16(), top = rd.u16(), fw = rd.u16(), fh = rd.u16();
      const pk = rd.u8();
      let lct = null;
      if (pk & 0x80) { const n = 1 << ((pk & 7) + 1); lct = rd.bytes(n * 3); }
      const interlaced = !!(pk & 0x40);
      const minCodeSize = rd.u8();
      const data = rd.subBlocks(collect);
      frames.push({
        left, top, w: fw, h: fh, interlaced, palette: lct || gct,
        minCodeSize, data,

  const dw = Math.max(1, Math.round(sw * s));
  const dh = Math.max(1, Math.round(sh * s));

  const dy = Math.round((size - dh) / 2);

}

  if (!/^[\u4e00-\u9fff\u3040-\u30ffA-Za-z]+$/.test(v)) return { ok: false, why: '含标点/符号' };

  const list = Array.from(files || []);

  let n = 0, bad = 0;
  const veil = showBusy('正在导入素材…');
  try {
    for (const f of list) {
      try {
        if (/\.zip$/i.test(f.name)) {
          let entries;
          try { entries = await unzip(await f.arrayBuffer()); }
          catch (e) { bad++; addImportError(f.name + '：' + e.message); continue; }
          const imgs = entries.filter(e => !e.error && /\.(gif|png|jpe?g|webp|bmp)$/i.test(e.name)
            && !/(^|\/)__MACOSX\//.test(e.name) && !/\._/.test(e.name) && !/\.DS_Store$/i.test(e.name));
          if (!imgs.length) { bad++; addImportError(f.name + '：压缩包里没有图片'); continue; }
          for (const e of imgs) {
            const nm = e.name.split(/[\\/]/).pop();
            const a = await addAsset({ name: nm, bytes: e.data, mime: mimeOf(nm) });
            if (a) n++; else { bad++; addImportError(nm + '：无法解析'); }
          }
        } else if (/\.(gif|png|jpe?g|webp|bmp)$/i.test(f.name)) {

      } catch (e) {

    }

    hideBusy(veil);
    renderAssets(); updateStats(); validateAll();
  }
  toast(`导入 ${n} 个素材` + (bad ? `，${bad} 个跳过：${IMPORT_ERRORS.slice(-2).join('；')}` : ''), bad ? 'warn' : 'ok', bad ? 5000 : 2600);

}
async function doPreview() {

  if (!a) { $('#pvCanvas').style.display = 'none'; $('#pvEmpty').style.display = ''; return; }
  $('#pvCanvas').style.display = '';
  $('#pvEmpty').style.display = 'none';
  const cv = $('#pvCanvas');
  const size = clamp(S.opt.size | 0, 16, 1200);
  cv.width = size; cv.height = size;
  const ctx = cv.getContext('2d');
  $('#pvOut').textContent = '渲染中…';
  try {
    const frames = await buildFrames(a, S.opt);
    if (token !== pvToken) return;
    pvFrames = frames; pvIdx = 0;
    $('#pvOut').textContent = `→ ${size}×${size}`;
    const step = () => {
      if (token !== pvToken) return;
      const f = pvFrames[pvIdx % pvFrames.length];
      if (!f) return;
      ctx.clearRect(0, 0, size, size);
      ctx.drawImage(f.canvas, 0, 0);
      const d = clamp((f.delay || 10) * 10, 30, 600);

    };
    S.playing = true;
    step();

/* ============================================================
   11. 生成（实例化，不动原素材）
   ============================================================ */
async function genFromAsset(src, kind, quiet) {
  if (!src) return null;
  const isCover = kind === 'cover';
  const size = isCover ? 200 : clamp(S.opt.size | 0, 16, 1200);
  const limit = isCover ? LIMIT.cover : (kind === 'png' ? LIMIT.png : LIMIT.gif);
  const stroke = isCover ? 0 : S.opt.stroke;
  const fit = S.opt.fit;
  const frameIdx = clamp(S.opt.frame | 0, 0, Math.max(0, (src.frames || 1) - 1));
  let frames, bytes, info = '', outFrames = 1;
  try {
    frames = await buildFrames(src, { size, fit, stroke }, kind === 'png' ? frameIdx : null);
  } catch (e) { toast('渲染失败：' + e.message, 'err'); return null; }
  if (!frames.length) { toast('素材没有可用帧', 'err'); return null; }
  if (kind === 'gif') {
    const rg = framesToRGBA(frames);
    const r = encodeGifFit(rg, size, size, limit, { colors: S.opt.colors, delta: S.opt.delta });
    bytes = r.bytes;
    outFrames = r.frames;
    info = `${r.colors} 色` + (r.dropped ? ` · 抽帧至 ${r.frames} 帧` : '');
    if (!r.fits) toast(`GIF 仍超出 ${fmtBytes(limit)}，可减少帧数或降低颜色`, 'warn', 3600);
    else if (r.dropped) toast(`为装进 ${fmtBytes(limit)}，已抽帧到 ${r.frames} 帧`, 'warn', 3600);
  } else {
    const r = await encodePngFit(frames[0].canvas, limit);
    bytes = r.bytes;
    info = r.mode;
  }
  const suffix = isCover ? '封面' : kind.toUpperCase();
  const nm = `${src.base}_${suffix}${isCover ? '' : '_' + size}`;
  const out = addAssetSync({
    name: nm, bytes, kind: kind === 'gif' ? 'gif' : 'png',
    mime: kind === 'gif' ? 'image/gif' : 'image/png',
    w: size, h: size, frames: kind === 'gif' ? outFrames : 1,
    gen: true, base: src.base,
    spec: { kind: kind === 'gif' ? 'gif' : 'png', size, stroke, fit }
  });
  out.srcId = src.id;
  if (!quiet) {
    renderAssets();
    toast(`已生成 ${nm}（${fmtBytes(bytes.length)}，${info}）`, 'ok', 3200);
    if (S.opt.autoFill) {
      const isGif = kind === 'gif';
      const key = isGif ? 'gif' : 'png';
      const other = isGif ? 'png' : 'gif';
      const base = (src.base || '').toLowerCase();
      let idx = S.cards.findIndex(c => {
        if (c[key]) return false;
        const o = getAsset(c[other]);
        return o && (o.base || '').toLowerCase() === base;
      });
      if (idx < 0) idx = S.cards.findIndex(c => !c[key]);
      if (idx >= 0) { assignCard(idx, out); toast('已填入 ' + pad2(idx + 1) + ' 号位', 'ok', 2000); }
      else toast('没有空位可自动填入', 'warn');
    }
  }
  return out;
}
async function generate(kind) {
  const a = S.sel ? getAsset(S.sel) : null;
  if (!a) { toast('先在左侧选中一个素材', 'warn'); return; }
  const h = showBusy(kind === 'cover' ? '正在生成封面…' : '正在生成…');

    await genFromAsset(a, kind, false);
  } catch (e) {
    console.error(e);

/* ============================================================
   12. 自检 / 校验

function collectIssues() {
  const errors = [], warns = [];
  let both = 0, partial = 0;
  const names = new Map();
  S.cards.forEach((c, i) => {
    const pos = pad2(i + 1);
    if (c.gif && c.png) both++;
    else if (c.gif || c.png) { partial++; errors.push(`${pos} 号位：GIF / PNG 只填了一半`); }
    if (c.gif || c.png) {
      const r = checkName(c.name);
      if (!r.ok) errors.push(`${pos} 号位：名称${r.why}`);
      else {
        const k = c.name.trim();
        if (names.has(k)) errors.push(`${pos} 号位：名称「${k}」与 ${names.get(k)} 重复`);
        else names.set(k, pos);
      }
    }
  });
  if (both < 16) warns.push(`只填了 ${both}/16 个位置，未填的不会导出`);
  if (!S.cover) errors.push('还没放封面图（200×200 PNG）');
  return { errors, warns, both };
}

        : ((a.kind !== 'gif' && a.w === size && a.h === size && a.size <= LIMIT.png) || (a.spec && a.spec.kind === 'png' && a.spec.size === size));

/* ============================================================
   13. 导出
   ============================================================ */
async function ensureBytes(id, kind, size, limit) {
  const a = getAsset(id);
  if (!a) return null;
  if (kind === 'gif') {
    if (a.kind === 'gif' && a.spec && a.spec.kind === 'gif' && a.spec.size === size && a.spec.stroke === S.opt.stroke) return a.bytes;
  } else {
    if (a.kind !== 'gif' && a.w === size && a.h === size && a.size <= limit) return a.bytes;
    if (a.spec && a.spec.kind === 'png' && a.spec.size === size) return a.bytes;
  }
  const frameIdx = kind === 'png' ? clamp(S.opt.frame | 0, 0, Math.max(0, (a.frames || 1) - 1)) : null;
  const frames = await buildFrames(a, { size, fit: S.opt.fit, stroke: S.opt.stroke }, frameIdx);
  if (!frames.length) return null;
  if (kind === 'gif') {
    const r = encodeGifFit(framesToRGBA(frames), size, size, limit, { colors: S.opt.colors, delta: S.opt.delta });
    return r.bytes;
  }
  const r = await encodePngFit(frames[0].canvas, limit);
  return r.bytes;
}
async function ensureCover() {
  const a = getAsset(S.cover);
  if (!a) return null;
  if (a.spec && a.spec.kind === 'png' && a.spec.size === 200) return a.bytes;
  if (a.kind !== 'gif' && a.w === 200 && a.h === 200 && a.size <= LIMIT.cover) return a.bytes;
  const frames = await buildFrames(a, { size: 200, fit: S.opt.fit, stroke: 0 });
  if (!frames.length) return null;
  const r = await encodePngFit(frames[0].canvas, LIMIT.cover);
  return r.bytes;
}
function confirmModal(opt) {

      <div class="modal-bd">${opt.html}</div>

        ${opt.cancel === null ? '' : `<button class="btn" data-close>${opt.cancel || '返回修改'}</button>`}

function download(blob, name) {

  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 6000);
}
async function blobToU8(b) { return new Uint8Array(await b.arrayBuffer()); }

  await w.close();
}

      } else {

    }

    ];

    await confirmModal({
      title: '导出完成',

      html: `<div style="font-size:12px;line-height:2">
        <div style="color:var(--ok);font-weight:600;margin-bottom:8px">✓ ${escapeHTML(where)}</div>
        ${rows.map(r => `<div class="chk-item ${r[2]}"><span class="ic">${r[2] === 'ok' ? '✓' : '!'}</span>${r[0]}<span class="sp">${r[1]}</span></div>`).join('')}
        <div style="margin-top:10px;color:var(--muted);font-size:11px;line-height:1.8">
          压缩包内为平铺文件，无嵌套文件夹；文件名格式 <code style="background:var(--panel3);padding:1px 4px;border-radius:4px">关键词_编号.gif</code>。
          ${overList.length ? `<br><span style="color:var(--warn)">超限：${escapeHTML(overList.join('、'))}</span>` : ''}
        </div></div>`
    });
    toast('导出完成', 'ok');
  } catch (e) {
    console.error(e);
    toast('导出失败：' + e.message, 'err', 5000);
  } finally {
    S.busy = false;

function fitBoard() {
  const board = $('#board'), grid = $('#grid'), cover = $('.cover-row');
  const c0 = cardEls[0];
  if (!board || !grid || !cover || !c0) return;
  const gap = 10;
  const cr = cover.getBoundingClientRect();
  const cardR = c0.getBoundingClientRect();
  const faceR = c0.querySelector('.flip').getBoundingClientRect();
  if (!cardR.width || !faceR.width) return;
  const inset = cardR.width - faceR.width;                    // 图片区左右边距 + 边框
  const chrome = Math.max(0, cardR.height - faceR.height);    // 除图片区以外的高度
  const availH = board.offsetHeight - 30 - cr.height - 14;     // 留给 4 行的总高
  const maxFace = (availH - 3 * gap) / 4 - chrome;
  const square = cardR.width - inset;
  const faceH = Math.max(56, Math.round(Math.min(square, maxFace)));
  if (grid.dataset.fh !== String(faceH)) {
    grid.dataset.fh = String(faceH);
    grid.style.setProperty('--face-h', faceH + 'px');
  }
  updateBoardScroll();
}
function updateBoardScroll() {
  const b = $('#board'), sr = $('.stage-right');
  if (!b || !sr) return;
  const more = b.scrollHeight - b.clientHeight - b.scrollTop > 8;

}
function initResizers() {
  // 三列都按可用宽度的**比例**分配，窗口缩放时等比变化
  const DEF = { assets: 0.126, stageLeft: 0.280, export: 0.210 };
  const defs = {
    assets: { sel: '.panel-assets', r: DEF.assets, minR: 0.09, maxR: 0.26, minPx: 168, maxPx: 470 },
    stageLeft: { sel: '.stage-left', r: DEF.stageLeft, minR: 0.15, maxR: 0.42, minPx: 246, maxPx: 820 },
    export: { sel: '.panel-export', r: DEF.export, minR: 0.13, maxR: 0.30, minPx: 226, maxPx: 620 },
  };
  const KEY = 'qes.layout.v3';
  const main = $('.main');
  const read = () => { try { return JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { return {}; } };
  const write = () => {
    try { localStorage.setItem(KEY, JSON.stringify({ assets: defs.assets.r, stageLeft: defs.stageLeft.r, export: defs.export.r })); } catch (e) { }
  };
  const hint = document.createElement('div');
  hint.className = 'rs-hint';
  document.body.appendChild(hint);
  const avail = () => Math.max(360, main.clientWidth - 36);   // 去掉左右内边距 + 两条分栏缝
  const pxOf = k => Math.round(clamp(avail() * defs[k].r, defs[k].minPx, defs[k].maxPx));
  const paint = k => {
    const el = $(defs[k].sel), w = pxOf(k);
    el.style.flex = '0 0 ' + w + 'px';
    el.style.width = w + 'px';
    return w;
  };
  const paintAll = () => { for (const k in defs) paint(k); };
  const saved = read();
  for (const k in defs) if (typeof saved[k] === 'number' && saved[k] > 0.04) defs[k].r = saved[k];
  paintAll();
  window.addEventListener('resize', paintAll);
  $$('.rs').forEach(rs => {
    const k = rs.dataset.for, d = defs[k];
    rs.addEventListener('pointerdown', e => {
      if (e.button !== 0) return;
      e.preventDefault();
      const x0 = e.clientX, w0 = pxOf(k);
      const sign = k === 'export' ? -1 : 1;
      rs.classList.add('on');
      document.body.classList.add('resizing');
      hint.classList.add('on');
      try { rs.setPointerCapture(e.pointerId); } catch (err) { }
      const move = ev => {
        const w = Math.round(clamp(w0 + (ev.clientX - x0) * sign, d.minPx, d.maxPx));
        d.r = clamp(w / avail(), d.minR, d.maxR);
        const el = $(d.sel);
        el.style.flex = '0 0 ' + w + 'px';
        el.style.width = w + 'px';
        hint.textContent = w + ' px  ·  ' + Math.round(w / avail() * 100) + '%';
        hint.style.left = Math.min(window.innerWidth - 90, ev.clientX + 14) + 'px';
        hint.style.top = (ev.clientY + 16) + 'px';
      };
      const up = () => {
        rs.classList.remove('on');
        document.body.classList.remove('resizing');
        hint.classList.remove('on');
        rs.removeEventListener('pointermove', move);
        rs.removeEventListener('pointerup', up);
        rs.removeEventListener('pointercancel', up);
        write();
        fitBoard();
      };
      rs.addEventListener('pointermove', move);
      rs.addEventListener('pointerup', up);
      rs.addEventListener('pointercancel', up);
    });
    rs.addEventListener('dblclick', () => {
      d.r = DEF[k];
      paintAll();
      write();
      fitBoard();
      toast('已复位分栏比例', '', 1400);
    });
  });
}

function autoPair() {
  const score = a => (isUsed(a.id) ? 0 : 100) + mateScore(a);
  // 同一关键词只保留一个最优素材
  const bestOf = kind => {
    const m = new Map();
    for (const a of S.assets) {
      const k = a.kind === 'gif' ? 'gif' : 'png';
      if (k !== kind) continue;
      const key = ((a.base || '').toLowerCase()) || ('#' + a.id);
      const cur = m.get(key);
      if (!cur || score(a) > score(cur)) m.set(key, a);
    }
    return m;
  };
  const gifMap = bestOf('gif'), pngMap = bestOf('png');
  let filled = 0;
  // 1) 给已有的一半补另一半（同名）
  S.cards.forEach(c => {
    if (c.gif && !c.png) {
      const g = getAsset(c.gif);
      const m = g && pngMap.get((g.base || '').toLowerCase());
      if (m && !isUsed(m.id)) { c.png = m.id; filled++; }
    } else if (c.png && !c.gif) {
      const p = getAsset(c.png);
      const m = p && gifMap.get((p.base || '').toLowerCase());
      if (m && !isUsed(m.id)) { c.gif = m.id; filled++; }
    }
  });
  // 2) 补空位：一个关键词只用一次
  const restG = Array.from(gifMap.values()).filter(a => !isUsed(a.id));
  const restP = Array.from(pngMap.values()).filter(a => !isUsed(a.id));
  S.cards.forEach(c => {
    if (!c.gif && restG.length) {
      const a = restG.shift();
      c.gif = a.id; filled++;
      if (!c.name) c.name = cleanKeyword(a.base);
    }
    if (!c.png) {
      const g = c.gif ? getAsset(c.gif) : null;
      let a = g ? pngMap.get((g.base || '').toLowerCase()) : null;
      if (a && isUsed(a.id)) a = null;
      if (!a) a = restP.find(x => !isUsed(x.id));
      if (a) {
        c.png = a.id; filled++;
        const i = restP.indexOf(a); if (i >= 0) restP.splice(i, 1);
        if (!c.name) c.name = cleanKeyword(a.base);
      }
    }
  });
  if (!S.cover) {
    const p = S.assets.filter(a => a.kind !== 'gif' && !isUsed(a.id)).sort((a, b) => score(b) - score(a))[0];
    if (p) S.cover = p.id;
  }
  renderBoard(); validateAll();
  toast(filled ? `自动填入 ${filled} 个位置` : '没有可自动配对的新素材', filled ? 'ok' : 'warn');
}

    const t1 = colTop(fc), t0 = colTop(plain[0].canvas);
    const spx = t1 >= 0 ? fc.getContext('2d').getImageData(150, t1, 1, 1).data : [0, 0, 0, 0];
    ok('描边向外扩展且为白色', t1 >= 0 && t1 < t0 && spx[0] > 240 && spx[1] > 240 && spx[2] > 240,
      `描边顶 ${t1} / 原图顶 ${t0} / rgba(${Array.from(spx).join(',')})`);

    const a = addAssetSync({ name: '可爱_01.gif', bytes: gifBytes, mime: 'image/gif', kind: 'gif', w: W, h: H, frames: 2 });
    ok('导入为素材对象', !!a && S.assets.length >= 1, a.name);
    const out = await genFromAsset(a, 'gif', true);
    ok('生成 GIF 实例', !!out && out.w === 300 && out.spec.kind === 'gif', out ? out.bytes.length + 'B' : 'null');
    const outP = await genFromAsset(a, 'png', true);
    ok('生成 PNG 实例', !!outP && outP.w === 300, outP ? outP.bytes.length + 'B' : 'null');
    const coverOut = await genFromAsset(a, 'cover', true);
    ok('生成封面', !!coverOut && coverOut.w === 200, coverOut ? coverOut.bytes.length + 'B' : 'null');
    if (out) {
      const rb = await createImageBitmap(new Blob([out.bytes], { type: 'image/gif' }));
      ok('生成结果可解码', rb.width === 300, rb.width + '×' + rb.height);
    }
    if (coverOut) {
      const cb = await createImageBitmap(new Blob([coverOut.bytes], { type: 'image/png' }));
      ok('封面可解码', cb.width === 200 && cb.height === 200, cb.width + '×' + cb.height);
    }
    // 命名与编号
    S.cards[0] = { gif: a.id, png: outP ? outP.id : null, name: '可爱', flip: false };
    S.cards[1] = { gif: a.id, png: outP ? outP.id : null, name: '生气', flip: false };
    const issues = collectIssues();
    ok('校验：缺封面被识别', issues.errors.some(e => e.includes('封面')), issues.errors.length + ' 项');
    ok('命名检查', checkName('可爱').ok && checkName('可爱1').ok === false && checkName('可爱_01').ok === false && checkName('超长名字啦').ok === false, '');
    const kw = (S.cards[0].name) + '_' + pad2(1);
    ok('文件编号格式', kw === '可爱_01', kw);
  } catch (e) {
    log.push({ name: '异常中断', pass: false, extra: e && e.message });
    console.error(e);
  }
  const pass = log.filter(l => l.pass).length;
  window.__selftest = log;
  const box = document.createElement('div');
  box.id = 'selftest-out';
  box.style.cssText = 'position:fixed;right:12px;bottom:12px;width:420px;max-height:70vh;overflow:auto;background:#fff;border:1px solid #ddd;border-radius:10px;padding:12px;font:12px/1.7 ui-monospace,Menlo,monospace;z-index:999;box-shadow:0 10px 40px rgba(0,0,0,.18)';
  box.innerHTML = `<b>自检 ${pass}/${log.length}</b><br>` + log.map(l =>
    `<span style="color:${l.pass ? '#0f9d57' : '#e0454b'}">${l.pass ? '✓' : '✗'} ${escapeHTML(l.name)}</span> <span style="color:#999">${escapeHTML(l.extra)}</span>`).join('<br>');
  document.body.appendChild(box);
  return { pass, total: log.length, log };
}
function init() {
  window.__S = S;
  buildGrid();
  bindEvents();
  initResizers();
  $('#expName').value = S.expName;
  renderAssets();
  renderBoard();
  validateAll();
  updateStats();
  updateNote();
  syncSize(300);
  requestAnimationFrame(() => {
    fitBoard();
    const b = $('#board');
    if (window.ResizeObserver) new ResizeObserver(() => fitBoard()).observe(b);
    b.addEventListener('scroll', updateBoardScroll, { passive: true });
    window.addEventListener('resize', fitBoard);
  });
  if (location.search.indexOf('selftest') >= 0) setTimeout(selfTest, 300);
}
document.addEventListener('DOMContentLoaded', init);

</script>
